- name: SD-WAN Policy Pack — objects
  hosts: checkpoint_mgmt
  gather_facts: false
  connection: httpapi

  vars_files:
    - group_vars/vault.yml
    - group_vars/vars.yml

  vars:
    n: "{{ resource_name_map }}"
    ansible_network_os: check_point.mgmt.checkpoint
    
    ansible_httpapi_use_ssl: true
    ansible_checkpoint_validate_certs: false
    ansible_httpapi_validate_certs: false

    ansible_user: ""
    ansible_password: ""
    ansible_checkpoint_use_api_key: true
    ansible_api_key: "{{ vault_checkpoint_api_key }}"
    ansible_checkpoint_domain: "{{ checkpoint_cloud_mgmt_id }}"

    checkpoint_network_objects:
      - name: "{{ n.net_ISP1_DC1_v4 }}"
        subnet: "{{ n.net_ISP1_DC1_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP1_DC1_v6 }}"
        subnet: "{{ n.net_ISP1_DC1_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP2_DC1_v4 }}"
        subnet: "{{ n.net_ISP2_DC1_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP2_DC1_v6 }}"
        subnet: "{{ n.net_ISP2_DC1_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP1_DC2_v4 }}"
        subnet: "{{ n.net_ISP1_DC2_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP1_DC2_v6 }}"
        subnet: "{{ n.net_ISP1_DC2_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP2_DC2_v4 }}"
        subnet: "{{ n.net_ISP2_DC2_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP2_DC2_v6 }}"
        subnet: "{{ n.net_ISP2_DC2_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP1_branch1_v4 }}"
        subnet: "{{ n.net_ISP1_branch1_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP1_branch1_v6 }}"
        subnet: "{{ n.net_ISP1_branch1_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP2_branch1_v4 }}"
        subnet: "{{ n.net_ISP2_branch1_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP2_branch1_v6 }}"
        subnet: "{{ n.net_ISP2_branch1_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP1_branch2_v4 }}"
        subnet: "{{ n.net_ISP1_branch2_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP1_branch2_v6 }}"
        subnet: "{{ n.net_ISP1_branch2_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_ISP2_branch2_v4 }}"
        subnet: "{{ n.net_ISP2_branch2_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_ISP2_branch2_v6 }}"
        subnet: "{{ n.net_ISP2_branch2_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_branch1_v4 }}"
        subnet: "{{ n.net_branch1_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_branch1_v6 }}"
        subnet: "{{ n.net_branch1_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_branch2_v4 }}"
        subnet: "{{ n.net_branch2_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_branch2_v6 }}"
        subnet: "{{ n.net_branch2_ipv6 }}"
        mask_length: 64
        ip_version: 6

      - name: "{{ n.net_datacenter_v4 }}"
        subnet: "{{ n.net_datacenter_ipv4 }}"
        mask_length: 24
        ip_version: 4

      - name: "{{ n.net_datacenter_v6 }}"
        subnet: "{{ n.net_datacenter_ipv6 }}"
        mask_length: 64
        ip_version: 6

    checkpoint_host_objects:
      - name: "{{ n['host_hq_win10-v4'] }}"
        ip_address: "{{ n.host_hq_win10_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_hq_win10-v6'] }}"
        ip_address: "{{ n['host_hq-win10_ipv6'] }}"
        ip_version: 6

      - name: "{{ n['host_hq_winDC-v4'] }}"
        ip_address: "{{ n.host_hq_winDC_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_hq_winDC-v6'] }}"
        ip_address: "{{ n['host_hq-winDC_ipv6'] }}"
        ip_version: 6

      - name: "{{ n['host_hq_lnx-v4'] }}"
        ip_address: "{{ n.host_hq_lnx_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_hq_lnx-v6'] }}"
        ip_address: "{{ n['host_hq-lnx_ipv6'] }}"
        ip_version: 6

      - name: "{{ n['host_gw_back_int-v4'] }}"
        ip_address: "{{ n.host_gw_back_int_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_gw_back_int-v6'] }}"
        ip_address: "{{ n.host_gw_back_int_ipv6 }}"
        ip_version: 6

      - name: "{{ n['host_Branch1_lnx-v4'] }}"
        ip_address: "{{ n.host_Branch1_lnx_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_Branch1_lnx0-v6'] }}"
        ip_address: "{{ n.host_Branch1_lnx_ipv6 }}"
        ip_version: 6

      - name: "{{ n['host_Branch1_win10-v4'] }}"
        ip_address: "{{ n.host_Branch1_win10_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_Branch1_win10-v6'] }}"
        ip_address: "{{ n.host_Branch1_win10_ipv6 }}"
        ip_version: 6

      - name: "{{ n['host_Branch2_lnx-v4'] }}"
        ip_address: "{{ n.host_Branch2_lnx_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_Branch2_lnx0-v6'] }}"
        ip_address: "{{ n.host_Branch2_lnx_ipv6 }}"
        ip_version: 6

      - name: "{{ n['host_Branch2_win10-v4'] }}"
        ip_address: "{{ n.host_Branch2_win10_ipv4 }}"
        ip_version: 4

      - name: "{{ n['host_Branch2_win10-v6'] }}"
        ip_address: "{{ n.host_Branch2_win10_ipv6 }}"
        ip_version: 6

  tasks:

    # ------------------------------------------------------------------
    # Service objects
    # ------------------------------------------------------------------

    - name: Create TCP service — {{ n.service_tcp_gaiawebui }}
      check_point.mgmt.cp_mgmt_service_tcp:
        name: "{{ n.service_tcp_gaiawebui }}"
        port: "{{ n.service_gaiawebui_port }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: "{{ n.val_false }}"
        state: present

    # ------------------------------------------------------------------
    # Host objects
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Host objects
    # ------------------------------------------------------------------

    - name: Create IPv4 host objects
      check_point.mgmt.cp_mgmt_host:
        name: "{{ hostobj.name }}"
        ipv4_address: "{{ hostobj.ip_address }}"
        color: "{{ n.color_black }}"
        nat_settings:
          auto_rule: "{{ n.val_false }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: "{{ n.val_false }}"
        state: present
      loop: "{{ checkpoint_host_objects }}"
      loop_control:
        loop_var: hostobj
        label: "{{ hostobj.name }}"
      when: hostobj.ip_version == 4

    - name: Create IPv6 host objects
      check_point.mgmt.cp_mgmt_host:
        name: "{{ hostobj.name }}"
        ipv6_address: "{{ hostobj.ip_address }}"
        color: "{{ n.color_black }}"
        nat_settings:
          auto_rule: "{{ n.val_false }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: "{{ n.val_false }}"
        state: present
      loop: "{{ checkpoint_host_objects }}"
      loop_control:
        loop_var: hostobj
        label: "{{ hostobj.name }}"
      when: hostobj.ip_version == 6
      
    # ------------------------------------------------------------------
    # Network objects
    # ------------------------------------------------------------------

    - name: Create IPv4 network objects
      check_point.mgmt.cp_mgmt_network:
        name: "{{ netobj.name }}"
        subnet: "{{ netobj.subnet }}"
        mask_length: "{{ netobj.mask_length }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: false
        state: present
      loop: "{{ checkpoint_network_objects }}"
      loop_control:
        loop_var: netobj
        label: "{{ netobj.name }}"
      when: netobj.ip_version == 4

    - name: Create IPv6 network objects
      check_point.mgmt.cp_mgmt_network:
        name: "{{ netobj.name }}"
        subnet6: "{{ netobj.subnet }}"
        mask_length6: "{{ netobj.mask_length }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: false
        state: present
      loop: "{{ checkpoint_network_objects }}"
      loop_control:
        loop_var: netobj
        label: "{{ netobj.name }}"
      when: netobj.ip_version == 6

    # ------------------------------------------------------------------
    # DNS domain objects
    # ------------------------------------------------------------------

    - name: Create DNS domain — {{ n.testDomain_object }}
      check_point.mgmt.cp_mgmt_dns_domain:
        name: "{{ n.testDomain_object }}"
        is_sub_domain: "{{ n.val_true }}"
        ignore_warnings: "{{ ignore_warnings }}"
        ignore_errors: "{{ n.val_false }}"
        state: present


    # ------------------------------------------------------------------
    # Publish
    # ------------------------------------------------------------------

    - name: Publish session
      check_point.mgmt.cp_mgmt_publish:
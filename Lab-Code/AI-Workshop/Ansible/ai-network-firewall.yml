---
# -----------------------------------------------------------------------------
# SD-WAN Policy Pack - policy package + rulebase
#
# Run AFTER the "SD-WAN Policy Pack - objects" playbook: this playbook does not
# create any objects, it only references them.
#
#   ansible-playbook -i inventories/lab.yml create_policy_package.yml
#   ansible-playbook -i inventories/lab.yml create_policy_package.yml -e install_policy=true
#
# NOTE: sections/rules are appended with position "bottom", which the Check
# Point modules do not treat as idempotent. Use this to create a NEW package;
# to rebuild, delete the package first.
# -----------------------------------------------------------------------------

- name: SD-WAN Policy Pack - policy package
  hosts: checkpoint_mgmt
  gather_facts: false
  connection: httpapi

  vars_files:
    - group_vars/vault.yml
    - group_vars/vars.yml

  vars:
    n: "{{ resource_name_map }}"

    # --- Connection (same auth model as the objects playbook) ---------------
    ansible_network_os: check_point.mgmt.checkpoint
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: true        # must stay true (network security policy)
    ansible_checkpoint_validate_certs: true
    ansible_user: ""
    ansible_password: ""
    ansible_checkpoint_use_api_key: true
    ansible_api_key: "{{ vault_checkpoint_api_key }}"
    ansible_checkpoint_domain: "{{ checkpoint_cloud_mgmt_id }}"

    # --- Behaviour ----------------------------------------------------------
    install_policy: false

    # --- Package ------------------------------------------------------------
    package_name: AI-Network-Firewall
    layer_name: "{{ package_name }} Network"    # default layer created with the package

    # --- Object references --------------------------------------------------
    # Gateways / VPN community: must already exist (REPLACE the community name).
    branch_gw: branch-gw
    hq_gw: hq-exl-gw
    vpn_community: Bra_DC_Community

    # Created by the objects playbook. The right-hand side is an ASSUMED mapping
    # from the screenshot to your resource_name_map keys - adjust if needed.
    obj_gaia_webui: "{{ n.service_tcp_gaiawebui }}"
    obj_domain_heise: "{{ n.testDomain_object }}"            # must resolve to ".heise.de"
    obj_net_branch: "{{ n.net_branch1_v4 }}"                 # screenshot: net_172.30.1.0_24
    obj_net_dc: "{{ n.net_datacenter_v4 }}"                  # screenshot: net_192.168.30.0_24
    obj_branch_mgmt_host: "{{ n['host_gw_back_int-v4'] }}"   # screenshot: Branch1-gw_magg1_int-v4

    # NOT created by the objects playbook - must exist (or add them there).
    obj_isp1: ISP1
    obj_isp2: ISP2

    # --- Rulebase (order = rule number) -------------------------------------
    access_rules:
      # Management (1)
      - section: Management
        name: Allow Management
        destination: ["{{ branch_gw }}", "{{ obj_branch_mgmt_host }}"]
        service: ["{{ obj_gaia_webui }}", ssh]

      # SD-WAN VPN Probing (2)
      - section: SD-WAN VPN Probing
        name: Allow SD-WAN VPN Probing
        source: ["{{ hq_gw }}", "{{ branch_gw }}"]
        destination: ["{{ branch_gw }}", "{{ hq_gw }}"]
        service: [echo-request]
        install_on: ["{{ branch_gw }}"]

      # ISP-Probing (3)
      - section: ISP-Probing
        name: Allow ISP-Probing
        source: ["{{ branch_gw }}", "{{ obj_isp1 }}", "{{ obj_isp2 }}"]
        destination: ["{{ branch_gw }}", "{{ obj_isp1 }}", "{{ obj_isp2 }}"]
        service: [echo-request]
        install_on: ["{{ branch_gw }}"]

      # Services (4-6)
      - section: Services
        name: icmp
        source: ["{{ obj_net_branch }}"]
        service: [echo-request]
      - section: Services
        name: DNS
        source: ["{{ obj_net_branch }}"]
        service: [dns]
      - section: Services
        name: NTP
        source: ["{{ obj_net_branch }}"]
        service: [ntp]

      # VPN Overlay (7-9)
      - section: VPN Overlay
        name: VPN traffic DC to Branch
        source: ["{{ obj_net_dc }}"]
        destination: ["{{ obj_net_branch }}"]
        vpn: ["{{ vpn_community }}"]
      - section: VPN Overlay
        name: VPN traffic Branch to DC
        source: ["{{ obj_net_branch }}"]
        destination: ["{{ obj_net_dc }}"]
        vpn: ["{{ vpn_community }}"]
        track: { type: Log, per_connection: true, per_session: true, accounting: true }
      - section: VPN Overlay
        name: to internet via VPN
        source: ["{{ obj_net_branch }}"]
        destination: ["{{ obj_domain_heise }}"]
        vpn: ["{{ vpn_community }}"]
        track: { type: Log, per_connection: true, per_session: true }

      # Outbound (10)
      - section: Outbound
        name: Internet
        source: ["{{ obj_net_branch }}"]
        destination: [Internet]
        track: { type: Log, accounting: true }

  tasks:
    - name: Fail early if the API key was not loaded from the vault
      ansible.builtin.assert:
        that:
          - vault_checkpoint_api_key is defined
          - vault_checkpoint_api_key | length > 0
        fail_msg: "vault_checkpoint_api_key is missing - check group_vars/vault.yml and the vault password."
      no_log: true
      run_once: true

    - name: Build the policy package
      block:
        - name: Create policy package
          check_point.mgmt.cp_mgmt_package:
            name: "{{ package_name }}"
            access: true
            threat_prevention: true
            installation_targets: ["{{ branch_gw }}"]
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        # Every section is appended at the bottom, followed by its rules, so
        # the final order matches the numbering of access_rules.
        - name: Section - Management
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: Management
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - Management
          check_point.mgmt.cp_mgmt_access_rule: &rule_args
            layer: "{{ layer_name }}"
            name: "{{ rule.name }}"
            position: bottom
            source: "{{ rule.source | default(['Any']) }}"
            destination: "{{ rule.destination | default(['Any']) }}"
            vpn: "{{ rule.vpn | default(['Any']) }}"
            service: "{{ rule.service | default(['Any']) }}"
            action: "{{ rule.action | default('Accept') }}"
            track: "{{ rule.track | default({'type': 'Log'}) }}"
            install_on: "{{ rule.install_on | default(['Policy Targets']) }}"
            ignore_warnings: "{{ ignore_warnings }}"
            state: present
          loop: "{{ access_rules | selectattr('section', 'equalto', 'Management') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - SD-WAN VPN Probing
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: SD-WAN VPN Probing
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - SD-WAN VPN Probing
          check_point.mgmt.cp_mgmt_access_rule: *rule_args
          loop: "{{ access_rules | selectattr('section', 'equalto', 'SD-WAN VPN Probing') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - ISP-Probing
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: ISP-Probing
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - ISP-Probing
          check_point.mgmt.cp_mgmt_access_rule: *rule_args
          loop: "{{ access_rules | selectattr('section', 'equalto', 'ISP-Probing') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - Services
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: Services
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - Services
          check_point.mgmt.cp_mgmt_access_rule: *rule_args
          loop: "{{ access_rules | selectattr('section', 'equalto', 'Services') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - VPN Overlay
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: VPN Overlay
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - VPN Overlay
          check_point.mgmt.cp_mgmt_access_rule: *rule_args
          loop: "{{ access_rules | selectattr('section', 'equalto', 'VPN Overlay') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - Outbound
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: Outbound
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Rules - Outbound
          check_point.mgmt.cp_mgmt_access_rule: *rule_args
          loop: "{{ access_rules | selectattr('section', 'equalto', 'Outbound') | list }}"
          loop_control:
            loop_var: rule
            label: "{{ rule.name }}"

        - name: Section - Cleanup
          check_point.mgmt.cp_mgmt_access_section:
            layer: "{{ layer_name }}"
            name: Cleanup
            position: bottom
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        # The package ships with a default "Cleanup rule". All sections above
        # were appended after it, so move it to the bottom (under the Cleanup
        # section) and align it with the screenshot.
        - name: Rule - Cleanup rule (move default rule to the bottom)
          check_point.mgmt.cp_mgmt_access_rule:
            layer: "{{ layer_name }}"
            name: Cleanup rule
            position: bottom
            source: [Any]
            destination: [Any]
            vpn: [Any]
            service: [Any]
            action: Drop
            track: { type: Log }
            install_on: ["{{ branch_gw }}"]
            ignore_warnings: "{{ ignore_warnings }}"
            state: present

        - name: Publish session
          check_point.mgmt.cp_mgmt_publish:

        - name: Install policy on {{ branch_gw }}
          check_point.mgmt.cp_mgmt_install_policy:
            policy_package: "{{ package_name }}"
            access: true
            threat_prevention: true
            targets: ["{{ branch_gw }}"]
          when: install_policy | bool

      rescue:
        - name: Discard the unpublished session after a failure
          check_point.mgmt.cp_mgmt_discard:

        - name: Abort
          ansible.builtin.fail:
            msg: "Policy package creation failed - session discarded, nothing was published."